name: Fluvial research analysis
on:
  workflow_dispatch:
    inputs:
      refresh:
        description: Refresh route layers from FeatureServer before analysis (temporary only)
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'scripts/analyze.py'
      - 'scripts/details.py'
      - 'scripts/select_candidates.py'
      - 'research/external_schedule_leads.csv'
      - 'scripts/refresh.py'
      - '.github/workflows/research-analysis.yml'
      - 'data/processed/supertransporte/**'
permissions:
  contents: write
concurrency:
  group: fluvial-research-main
  cancel-in-progress: false
jobs:
  analyze:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh source layers temporarily
        if: inputs.refresh == true
        run: python scripts/refresh.py
      - name: Install geographic analysis dependencies
        run: python -m pip install shapely==2.1.2 pyproj==3.7.2
      - name: Generate research outputs
        run: python scripts/select_candidates.py
      - name: Commit results only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/generated/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update fluvial research summaries"
          git push origin HEAD:main
